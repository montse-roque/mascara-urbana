<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto | Máscara Urbana</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white">

<section class="container mx-auto px-6 py-16">

<h1 class="text-5xl font-black mb-10">

Contacto

</h1>

<form class="max-w-xl">

<div class="mb-4">

<input
type="text"
placeholder="Nombre"
class="w-full p-4 rounded bg-zinc-900">

</div>

<div class="mb-4">

<input
type="email"
placeholder="Correo"
class="w-full p-4 rounded bg-zinc-900">

</div>

<div class="mb-4">

<input
type="tel"
placeholder="Teléfono"
class="w-full p-4 rounded bg-zinc-900">

</div>

<div class="mb-4">

<textarea
rows="6"
placeholder="Mensaje"
class="w-full p-4 rounded bg-zinc-900"></textarea>

</div>

<button
class="bg-yellow-500 text-black font-bold px-8 py-4 rounded">

Enviar Mensaje

</button>

</form>

</section>

</body>

</html>
